<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<header class="navbar"><h2>Campus Issue Prioritization and Management System</h2></header>
<div class="login-container" id="box">
    <h2>🎓 Student Login</h2>
    <form id="loginForm">
        <div class="field"><label>College Email</label><input type="email" id="email"></div>
        <div class="field">
            <label>Password</label>
            <div class="password-field">
                <input type="password" id="password">
                <span class="toggle-eye" onclick="togglePassword()">Show</span>
            </div>
        </div>
        <p id="errorMsg" class="error"></p>
        <button type="submit">Login</button>
    </form>
    <p class="link-row"><span class="text-link" onclick="toggleResetPanel()">Forgot Password?</span></p>
    <div class="reset-panel" id="resetPanel" hidden>
        <h3>Reset Student Password</h3>
        <p class="reset-note">Enter your registered college email. We will send a one-time password (OTP) to that inbox so you can reset it here.</p>
        <form id="resetForm">
            <div class="field"><label>Registered Email</label><input type="email" id="resetEmail"></div>
            <div class="field" id="otpField" hidden><label>Email OTP</label><input type="text" id="resetOtp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP"></div>
            <div class="field" id="newPasswordField" hidden><label>New Password</label><input type="password" id="resetNewPassword"></div>
            <div class="field" id="confirmPasswordField" hidden><label>Confirm Password</label><input type="password" id="resetConfirmPassword"></div>
            <p id="resetMsg" class="error"></p>
            <button type="submit" id="resetSubmitBtn">Send OTP</button>
            <button type="button" class="secondary-btn" onclick="toggleResetPanel(false)">Cancel</button>
        </form>
    </div>
    <p class="auth-text">Don't have an account? <span class="signup-link" onclick="location.href='student_signup.html'">Sign up</span></p>
    <p class="back-home" onclick="location.href='user.html'">Back to User Portal</p>
</div>
<script src="app.js"></script>
<script src="student_login.js"></script>
</body>
</html>
