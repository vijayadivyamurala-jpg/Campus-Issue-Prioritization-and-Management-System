<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Stage View</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="chatbot.css">
</head>
<body class="dashboard-body">
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="dashboard-shell">
    <aside class="dashboard-sidebar">
        <h1>Campus Issue Hub</h1>
        <p>Admin control center</p>
        <div class="dashboard-nav">
            <a href="admin_dashboard.html">Dashboard</a>
            <a href="admin_issues.html">Issue management</a>
            <a href="department_dashboard.html">Department view</a>
            <button type="button" onclick="logoutAdmin()">Logout</button>
        </div>
    </aside>

    <main class="dashboard-main">
        <div class="dashboard-topbar">
            <div>
                <h2 id="issueStageTitle">Issue stage view</h2>
                <p id="issueStageSubtitle">View all issues for the selected status in one place.</p>
            </div>
            <span class="pill live-chip"><span class="live-dot"></span><span id="issueStageSync">Live issue view</span></span>
        </div>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h3 id="issueStagePanelTitle">Issues</h3>
                    <p id="issueStagePanelCopy">All issues in the selected category appear here.</p>
                </div>
                <a href="admin_issues.html" class="ghost-btn">Back to issue board</a>
            </div>
            <div class="search-toolbar">
                <div class="search-field">
                    <label for="issueStageSearch">Search by issue ID</label>
                    <input
                        type="search"
                        id="issueStageSearch"
                        placeholder="Search within this stage"
                        oninput="refreshAdminView()"
                    >
                </div>
                <div class="search-field">
                    <label for="issueStageDepartmentFilter">Filter by</label>
                    <select id="issueStageDepartmentFilter" onchange="updateIssueStageDepartmentFilter()">
                        <option value="">All departments</option>
                        <option value="Electrical Maintenance">Electrical Maintenance</option>
                        <option value="Civil Maintenance">Civil Maintenance</option>
                        <option value="IT Support">IT Support</option>
                        <option value="Academic Facilities">Academic Facilities</option>
                        <option value="Hostel Administration">Hostel Administration</option>
                        <option value="Housekeeping">Housekeeping</option>
                        <option value="Campus Security">Campus Security</option>
                        <option value="General Administration">General Administration</option>
                        <option value="__unassigned__">Unassigned</option>
                    </select>
                </div>
            </div>
            <div class="issue-card-list" id="issueStageList"></div>
        </section>
    </main>
</div>

<script src="app.js"></script>
<script src="admin.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
