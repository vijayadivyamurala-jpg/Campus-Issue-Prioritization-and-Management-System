<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chatbot.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<header class="navbar">
    <h2>Campus Issue Prioritization and Management System</h2>
</header>

<section class="hero">
    <h1>Select User Type</h1>
</section>

<section class="cards">
    <div class="card">
        <div class="card-header">
            <span class="icon">🎓</span>
            <h3>Student</h3>
        </div>
        <button onclick="location.href='student_login.html'">Login</button>
        <p class="signup-text">
            Don't have an account?
            <span class="signup-link" onclick="location.href='student_signup.html'">Sign up</span>
        </p>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="icon">👨‍💼</span>
            <h3>Staff</h3>
        </div>
        <button onclick="location.href='staff_login.html'">Login</button>
        <p class="signup-text">
            Don't have an account?
            <span class="signup-link" onclick="location.href='staff_signup.html'">Sign up</span>
        </p>
    </div>
</section>

<p class="section-copy">Issue reporting is available after login from the student or staff dashboard.</p>
<p class="back-home" onclick="location.href='index.html'">← Back to Home</p>
<script src="app.js"></script>
<script>
const activeSession = CampusApp.getSession();
if (activeSession && (activeSession.role === "student" || activeSession.role === "staff")) {
    window.location.href = CampusApp.getDashboardPath(activeSession.role);
}
</script>
<script src="chatbot.js"></script>
</body>
</html>
