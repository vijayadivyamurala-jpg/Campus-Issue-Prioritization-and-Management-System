<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<header class="navbar"><h2>Campus Issue Prioritization and Management System</h2></header>
<div class="login-container" id="box">
    <h2>🎓 Student Sign Up</h2>
    <form id="signupForm">
        <div class="name-row">
            <div class="field"><label>First Name <span class="required">*</span></label><input type="text" id="fname"></div>
            <div class="field"><label>Last Name <span class="required">*</span></label><input type="text" id="lname"></div>
        </div>
        <div class="field"><label>College Email <span class="required">*</span></label><input type="email" id="email" placeholder="24b81a6695@cvr.ac.in"></div>
        <div class="field"><label>Create Password <span class="required">*</span></label><input type="password" id="password"></div>
        <div class="field"><label>Confirm Password <span class="required">*</span></label><input type="password" id="confirm"></div>
        <p id="errorMsg" class="error"></p>
        <button type="submit">Create Account</button>
    </form>
    <p class="auth-text">Already have an account? <span class="signup-link" onclick="location.href='student_login.html'">Login</span></p>
    <p class="back-home" onclick="location.href='user.html'">Back to User Portal</p>
</div>
<script src="app.js"></script>
<script src="student_signup.js"></script>
</body>
</html>
