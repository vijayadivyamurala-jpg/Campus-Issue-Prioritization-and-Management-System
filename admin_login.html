<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<header class="navbar"><h2>Campus Issue Prioritization and Management System</h2></header>
<div class="login-container" id="box">
    <h2>🛠️ Admin Login</h2>
    <form id="adminForm">
        <div class="field">
            <label>Admin ID</label>
            <input type="text" id="adminId" placeholder="Enter admin ID">
        </div>
        <div class="field">
            <label>Password</label>
            <div class="password-field">
                <input type="password" id="password" placeholder="Enter password">
                <span class="toggle-eye" onclick="togglePassword()">Show</span>
            </div>
        </div>
        <p id="errorMsg" class="error"></p>
        <button type="submit">Login</button>
    </form>
    <p class="link-row"><span class="text-link" onclick="toggleResetPanel()">Forgot Password?</span></p>
    <div class="reset-panel" id="resetPanel" hidden>
        <h3>Reset Admin Password</h3>
        <p class="reset-note">Enter the admin ID and set a new password for this local admin portal.</p>
        <form id="resetForm">
            <div class="field"><label>Admin ID</label><input type="text" id="resetAdminId" placeholder="Enter admin ID"></div>
            <div class="field"><label>New Password</label><input type="password" id="resetPasswordField" placeholder="Enter new password"></div>
            <div class="field"><label>Confirm Password</label><input type="password" id="resetConfirmPasswordField" placeholder="Confirm new password"></div>
            <p id="resetMsg" class="error"></p>
            <button type="submit">Update Password</button>
            <button type="button" class="secondary-btn" onclick="toggleResetPanel(false)">Cancel</button>
        </form>
    </div>
    <p class="back-home" onclick="location.href='index.html'">Back to Home</p>
</div>
<script src="app.js"></script>
<script src="admin_login.js"></script>
</body>
</html>
