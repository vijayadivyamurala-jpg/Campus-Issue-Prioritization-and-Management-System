<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="chatbot.css">
</head>
<body class="dashboard-body">
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="dashboard-shell">
    <aside class="dashboard-sidebar">
        <h1>Campus Issue Hub</h1>
        <p id="trackingRole">Live tracking</p>
        <div class="dashboard-nav">
            <a id="trackingDashboardLink" href="student_dashboard.html">My dashboard</a>
            <a href="report_issue.html">Report an issue</a>
            <a href="tracking.html" class="active">Live tracking</a>
            <button type="button" onclick="logoutUser()">Logout</button>
        </div>
    </aside>

    <main class="dashboard-main">
        <div class="dashboard-topbar">
            <div>
                <h2>Live issue tracking</h2>
                <p>Follow every issue on a dedicated progress timeline with real-time refresh.</p>
            </div>
            <span class="pill live-chip"><span class="live-dot"></span><span id="trackingSync">Live tracking enabled</span></span>
        </div>

        <section class="tracking-grid" id="trackingList"></section>
    </main>
</div>

<script src="app.js"></script>
<script src="tracking.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
