<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<header class="navbar"><h2>Campus Issue Prioritization and Management System</h2></header>
<div class="login-container" id="box">
    <h2>Reset Password</h2>
    <p class="reset-note">Enter your registered email, select the account type, and use the OTP sent to your inbox to set a new password.</p>
    <form id="completeResetForm">
        <div class="field">
            <label>Account Type</label>
            <select id="accountType">
                <option value="student">Student</option>
                <option value="staff">Staff</option>
                <option value="department">Department</option>
            </select>
        </div>
        <div class="field"><label>Registered Email</label><input type="email" id="resetEmail"></div>
        <div class="field"><label>Email OTP</label><input type="text" id="resetOtp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP"></div>
        <div class="field"><label>New Password</label><input type="password" id="newPassword"></div>
        <div class="field"><label>Confirm Password</label><input type="password" id="confirmPassword"></div>
        <p id="resetMsg" class="error"></p>
        <button type="submit">Update Password</button>
    </form>
    <p class="back-home" onclick="location.href='user.html'">Back to User Portal</p>
</div>
<script src="app.js"></script>
<script src="reset_password.js"></script>
</body>
</html>
